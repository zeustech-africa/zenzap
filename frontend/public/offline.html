<!DOCTYPE html>
<html>
<head>
  <title>ZENZAP - Offline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #6C2BD9, #FF6B35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
      text-align: center;
    }
    .container { padding: 20px; }
    .icon { font-size: 80px; margin-bottom: 20px; }
    h1 { font-size: 28px; margin-bottom: 10px; }
    p { opacity: 0.8; margin-bottom: 30px; }
    button { background: white; color: #6C2BD9; border: none; padding: 12px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">⚡</div>
    <h1>You're Offline</h1>
    <p>Load shedding? We'll be back when your connection returns.<br>Your data will sync automatically.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
